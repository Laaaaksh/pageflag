name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# A release run must never be cancelled mid-publish (the image or release notes could
# end up half-shipped), so overlapping runs queue instead of racing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Generate release notes from CHANGELOG
        id: notes
        run: |
          scripts/release-notes.sh "$RUNNER_TEMP/release-notes.md" "${GITHUB_REF_NAME#v}"
          echo "path=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Compute lowercase image name
        id: image
        # GHCR image names must be lowercase; a mixed-case GitHub owner/repo isn't.
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.3.0

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2.6.2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          fail_on_unmatched_files: false
