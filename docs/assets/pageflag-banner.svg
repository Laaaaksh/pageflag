<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-label="pageflag">
  <rect width="720" height="240" fill="none"/>

  <!-- browser mockup -->
  <g transform="translate(16,16)">
    <rect width="430" height="208" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <rect width="430" height="36" rx="10" fill="#f3f4f6"/>
    <rect y="34" width="430" height="2" fill="#e5e7eb"/>
    <circle cx="20" cy="18" r="5" fill="#ff5f57"/>
    <circle cx="38" cy="18" r="5" fill="#febc2e"/>
    <circle cx="56" cy="18" r="5" fill="#28c840"/>
    <rect x="80" y="10" width="300" height="16" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="94" y="22" font-family="system-ui, sans-serif" font-size="10" fill="#9ca3af">your-staging-site.com</text>

    <!-- page content -->
    <rect x="24" y="56" width="180" height="14" rx="3" fill="#d1d5db"/>
    <rect x="24" y="80" width="382" height="10" rx="3" fill="#e5e7eb"/>
    <rect x="24" y="98" width="340" height="10" rx="3" fill="#e5e7eb"/>
    <rect x="24" y="116" width="360" height="10" rx="3" fill="#e5e7eb"/>

    <!-- the flagged element -->
    <rect x="24" y="140" width="150" height="34" rx="6" fill="#fff" stroke="#6d28d9" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="34" y="150" width="90" height="8" rx="2" fill="#c4b5fd"/>
    <rect x="34" y="163" width="60" height="6" rx="2" fill="#ddd6fe"/>

    <!-- pin marker -->
    <g transform="translate(174,140)">
      <path d="M13 0C5.8 0 0 5.8 0 13c0 9.5 13 22 13 22s13-12.5 13-22C26 5.8 20.2 0 13 0Z" fill="#6d28d9"/>
      <text x="13" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff">1</text>
    </g>

    <!-- comment popover -->
    <g transform="translate(210,120)">
      <rect width="196" height="58" rx="8" fill="#111827"/>
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#f9fafb">This button breaks on</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#f9fafb">mobile — please fix</text>
      <text x="12" y="52" font-family="system-ui, sans-serif" font-size="9" fill="#9ca3af">Jamie · just now</text>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(486,70)">
    <text x="0" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="#111827">page<tspan fill="#6d28d9">flag</tspan></text>
    <text x="2" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#6b7280">Click it. Flag it. Ship the fix.</text>
  </g>
</svg>
